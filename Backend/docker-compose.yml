services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agencydesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      APP_DB_PASSWORD: app_pw
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agencydesk"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - agencydesk_pg:/var/lib/postgresql/data
      - ./init-app-user.sh:/docker-entrypoint-initdb.d/01-init-app-user.sh:ro

volumes:
  agencydesk_pg:
